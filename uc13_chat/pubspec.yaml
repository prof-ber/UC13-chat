name: uc13_chat
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^0.8.7+5
  http: 1.3.0
  shared_preferences: ^2.5.3
  web_socket_channel: ^2.1.0
  socket_io_client: ^2.0.2
  flutter_mobx: ^2.0.6+5
  flutter_colorpicker: ^1.1.0
  provider: ^6.1.4
  google_fonts: ^5.1.0
  mobx: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/default_avatar.png

  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/static/RobotoMono-Regular.ttf
        - asset: assets/fonts/static/RobotoMono-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true